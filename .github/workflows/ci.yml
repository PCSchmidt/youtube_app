name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # lock resolved numpy 2.5.3, which needs >= 3.12
      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Stage 3 build proof: the image must build from the single pinned lockfile.
  # No registry push (local-only portfolio project) and no docker-in-pytest:
  # `make test` stays fast, offline, and docker-free.
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (build proof, no push)
        run: docker build -t yt-rag:ci .
