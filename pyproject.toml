[project]
name = "yt_rag"
version = "0.1.0"
description = "RAG over YouTube transcripts: chunking, embeddings, vector search, top-k retrieval."
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.11",
    "sentence-transformers>=3.0",
    "youtube-transcript-api>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
